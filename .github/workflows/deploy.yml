name: DRF CI/CD Docker
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  PYTHON_VERSION: '3.10'

jobs:
  # Lint + Security
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Lint & Security
        run: |
          pip install --upgrade pip
          pip install flake8 black==24.8.0 mypy bandit
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          black --check .
          mypy . --install-types --non-interactive
          bandit -r .

      - name: MyPy (SKIP deps check)
        run: |
          mypy . \
            --ignore-missing-imports \
            --no-strict \
            --install-types \
            --non-interactive

  # Тесты (SQLite)
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Verify packages
        run: |
          python -c "import corsheaders; print('✅ corsheaders OK')"
          python -c "import decouple; print('✅ decouple OK')"
          pip list | grep -E "(corsheaders|celery|redis|djangorestframework)"

      - name: Create test .env (SQLite!)
        run: |
          mkdir -p config
          cat > config/.env << 'EOF'
          SECRET_KEY=django-insecure-ci-test-key-1234567890abcdef123456
          DEBUG=True
          ALLOWED_HOSTS=localhost,127.0.0.1,::1
          DATABASE_URL=sqlite:///:memory:
          CELERY_TASK_ALWAYS_EAGER=True
          CELERY_TASK_EAGER_PROPAGATES=True
          EOF

      - name: Django check
        run: python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          PYTHONPATH: .

      - name: Run migrations (SQLite)
        run: python manage.py migrate --run-syncdb
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          PYTHONPATH: .

      - name: Run tests
        run: pytest -v --cov=. --cov-report=xml --cov-report=term-missing
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          PYTHONPATH: .

  # Docker
  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/develop'
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push Docker image
        if: github.ref == 'refs/heads/develop'
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t ${{ secrets.DOCKER_USERNAME }}/drf-app:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/drf-app:latest \
            --push .

      - name: Build Docker image (PR)
        if: github.event_name == 'pull_request'
        run: docker build . --file Dockerfile

  # Deploy (только develop)
  deploy:
    needs: docker-build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} '
            set -e
            cd ${{ secrets.DEPLOY_PATH }} &&
            git pull origin develop &&
            docker-compose down --remove-orphans &&
            docker-compose pull &&
            docker-compose build --no-cache web &&
            docker-compose up -d &&
            docker-compose exec -T web python manage.py migrate &&
            docker system prune -f --volumes'