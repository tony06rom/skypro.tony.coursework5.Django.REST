name: DRF CI/CD Docker
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install django==4.2.16 djangorestframework==3.15.2 celery==5.4.0 redis==5.0.8 pytest==7.4.4
          pip install -r requirements.txt --force-reinstall --no-deps --quiet

      - name: Django settings for CI
        run: |
          echo "SECRET_KEY=django-insecure-ci-test-key" > config/.env.test
          echo "DEBUG=True" >> config/.env.test
          echo "DATABASE_URL=sqlite:///test.db" >> config/.env.test
          echo "CELERY_TASK_ALWAYS_EAGER=True" >> config/.env.test

      - name: Run Django migrations
        run: python manage.py migrate
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          PYTHONPATH: .

      - name: Run pytest
        run: pytest
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          PYTHONPATH: .
  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub (опционально)
        if: github.ref == 'refs/heads/develop'
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
      - name: Build and push
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/drf-app:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/drf-app:${{ github.sha }}
  deploy:
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} '
            cd ${{ secrets.DEPLOY_PATH }} &&
            git pull origin develop &&
            docker-compose down &&
            docker-compose build --no-cache &&
            docker-compose up -d &&
            docker-compose exec web python manage.py migrate &&
            docker image prune -f'