name: DRF CI/CD Docker
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ALL dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # Critical dependencies for your project:
          pip install django==4.2.16 djangorestframework==3.15.2
          pip install celery==5.4.0 redis==5.0.8
          pip install python-decouple==3.8
          pip install pytest==7.4.4 pytest-django==4.8.0
          pip install psycopg2-binary==2.9.9  # PostgreSQL

      - name: Django settings for CI
        run: |
          mkdir -p config
          cat > config/.env.test << EOF
          SECRET_KEY=django-insecure-ci-test-key-1234567890
          DEBUG=True
          DATABASE_URL=sqlite:///:memory:
          CELERY_TASK_ALWAYS_EAGER=True
          CELERY_TASK_EAGER_PROPAGATES=True
          EOF

      - name: Run Django migrations
        run: python manage.py migrate
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          PYTHONPATH: .

      - name: Run pytest
        run: pytest
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          PYTHONPATH: .
  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub (опционально)
        if: github.ref == 'refs/heads/develop'
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
      - name: Build and push
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/drf-app:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/drf-app:${{ github.sha }}
  deploy:
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} '
            cd ${{ secrets.DEPLOY_PATH }} &&
            git pull origin develop &&
            docker-compose down &&
            docker-compose build --no-cache &&
            docker-compose up -d &&
            docker-compose exec web python manage.py migrate &&
            docker image prune -f'