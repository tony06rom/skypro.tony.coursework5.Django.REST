name: Django Habits CI/CD
on: [push, pull_request]

env:
  DJANGO_SETTINGS_MODULE: config.settings
  DB_NAME: testdb
  DB_PASSWORD: testpass
  DB_USER: testuser
  DB_HOST: localhost
  DB_PORT: 5432

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ env.DB_USER }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
          POSTGRES_DB: ${{ env.DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary

      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U ${{ env.DB_USER }} -d ${{ env.DB_NAME }}; then
              echo "✅ PostgreSQL ready!"
              exit 0
            fi
            echo "⏳ Waiting... ($i/10)"
            sleep 5
          done
          exit 1

      - name: Django check
        env:
          SECRET_KEY: django-insecure-ci-cd-test-key-1234567890abcdef12345678901234567890
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
          DATABASE_NAME: ${{ env.DB_NAME }}
          DATABASE_HOST: ${{ env.DB_HOST }}
          DATABASE_PORT: ${{ env.DB_PORT }}
          DATABASE_USER: ${{ env.DB_USER }}
          DATABASE_PASSWORD: ${{ env.DB_PASSWORD }}
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          TELEGRAM_BOT_TOKEN: dummy
          EMAIL: test@example.com
          EMAIL_PASS: testpass
        run: python manage.py check

      - name: Run migrate
        env:
          SECRET_KEY: django-insecure-ci-cd-test-key-1234567890abcdef12345678901234567890
          DEBUG: "True"
          DATABASE_NAME: ${{ env.DB_NAME }}
          DATABASE_HOST: ${{ env.DB_HOST }}
          DATABASE_PORT: ${{ env.DB_PORT }}
          DATABASE_USER: ${{ env.DB_USER }}
          DATABASE_PASSWORD: ${{ env.DB_PASSWORD }}
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py migrate --run-syncdb

      - name: Run tests
        env:
          SECRET_KEY: django-insecure-ci-cd-test-key-1234567890abcdef12345678901234567890
          DEBUG: "True"
          DATABASE_NAME: ${{ env.DB_NAME }}
          DATABASE_HOST: ${{ env.DB_HOST }}
          DATABASE_PORT: ${{ env.DB_PORT }}
          DATABASE_USER: ${{ env.DB_USER }}
          DATABASE_PASSWORD: ${{ env.DB_PASSWORD }}
          REDIS_URL: redis://localhost:6379/0
          TELEGRAM_BOT_TOKEN: dummy
        run: pytest -v

  linting:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install flake8
        run: pip install flake8

      - name: Run PEP8 compliance check
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build:
    runs-on: ubuntu-latest
    needs: linting

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in in Docker hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy Docker
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << EOF
            sudo docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}
            sudo docker stop myapp || true
            sudo docker rm myapp || true
            sudo docker run -d --name myapp -p 80:8000 ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}
          EOF