name: DRF CI/CD Docker
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  PYTHON_VERSION: '3.13'
  DJANGO_SETTINGS_MODULE: config.settings

jobs:
  # Lint + Security
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Lint & Security
        run: |
          pip install --upgrade pip
          pip install flake8 black==24.8.0 isort
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          black --check .
          isort . --check-only

  # Тесты
  test:
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary  # ← PostgreSQL driver

      - name: Wait for PostgreSQL ✅
        run: |
          for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U testuser -d testdb; then
              echo "✅ PostgreSQL ready!"
              exit 0
            fi
            echo "⏳ Waiting... ($i/10)"
            sleep 5
          done
          exit 1

      - name: Create test .env
        run: |

      - name: Django check
        run: python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          PYTHONPATH: .

      - name: Run migrations
        run: python manage.py migrate --run-syncdb
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          PYTHONPATH: .

      - name: Run tests
        run: pytest -v --cov=. --cov-report=term-missing
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          PYTHONPATH: .

  # Docker
  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/develop'
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push Docker image
        if: github.ref == 'refs/heads/develop'
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t ${{ secrets.DOCKER_USERNAME }}/drf-app:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/drf-app:latest \
            --push .

      - name: Build Docker image (PR)
        if: github.event_name == 'pull_request'
        run: docker build . --file Dockerfile

  # Deploy
  deploy:
    needs: docker-build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} '
            set -e
            cd ${{ secrets.DEPLOY_PATH }} &&
            git pull origin develop &&
            docker-compose down --remove-orphans &&
            docker-compose pull &&
            docker-compose build --no-cache web &&
            docker-compose up -d &&
            docker-compose exec -T web python manage.py migrate &&
            docker system prune -f --volumes'